{% set name = "pyglet" %}
{% set version = "2.1.19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 77fae024df940c60917ba604bab9b7e26306d66734186634b698c708cdd9f4be

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2,<5
  run:
    - python
    # while technically optional, needed for basic import of pyglet.font (this behavior may be different on OSX).
    - freetype
  run_constrained:
    - ffmpeg >=4,<10

test:
  # additional import tests in run run_tests.py need to set lib flags prior to importing others to work with no display CI scenario.
  # the project tests require a screen and won't work on CI.
  import:
    - pyglet
  files:
    - run_tests.py
  requires:
    - pip
    - libglu  # [linux]
    # required for pyglet.media.codecs.ffmpeg import test
    - ffmpeg  # [linux or win]
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"

about:
  home: https://pyglet.org
  summary: The cross-platform windowing and multimedia library for Python.
  description: |
    pyglet is a cross-platform windowing and multimedia library for Python,
    intended for developing games and other visually rich applications.
    It supports Windowing, input event handling, Controllers & Joysticks,
    OpenGL graphics, loading images and videos, and playing sounds and music.
    pyglet works on Windows, OS X and Linux.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  dev_url: https://github.com/pyglet/pyglet
  doc_url: https://pyglet.readthedocs.io

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hoechenberger
