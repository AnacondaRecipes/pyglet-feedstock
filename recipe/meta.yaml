{% set name = "pyglet" %}
{% set version = "2.1.19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 77fae024df940c60917ba604bab9b7e26306d66734186634b698c708cdd9f4be

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2,<5
  run:
    - python
    #- freetype
    #- future
    #- ffmpeg >=4,<6
  run_constrained:
    - ffmpeg >=4,<10

test:
  # We moved all "import ..." tests to `run_tests.py` because on Linux, we
  # need to run the tests through xvfb-run as some of them require a
  # (virtual) display. On Windows and macOS, on the other hand, we can run the
  # test script directly.
  requires:
    - libglu  # [linux]
    # required for pyglet.media.codecs.ffmpeg import tests
    - ffmpeg  # [linux or win]
  files:
    - run_tests.py
  commands:
    - python run_tests.py  # [not linux]
    - xvfb-run --server-args=":99 -screen 0 1024x768x24 -ac +extension GLX -noreset" python run_tests.py  # [linux]

about:
  home: https://pyglet.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  dev_url: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hoechenberger
