{% set name = "pyglet" %}
{% set version = "2.1.19" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 77fae024df940c60917ba604bab9b7e26306d66734186634b698c708cdd9f4be

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  skip: true  # [py<38]

requirements:
  host:
    - python
    - pip
    - flit-core >=3.2,<5
  run:
    - python
    # while technically optional, needed for basic import of pyglet.font (this behavior may be different on OSX).
    - freetype
  run_constrained:
    - ffmpeg >=4,<10

{% set skip_tests = "" %}

test:
  # import tests needs to set library options prior to importing everything to support no display CI scenario
  requires:
    - pip
    - pytest
    - libglu  # [linux]
    # required for pyglet.media.codecs.ffmpeg import test
    - ffmpeg  # [linux or win]
  files:
    - run_tests.py
  source_files:
    - tests
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - python run_tests.py
    - pytest -vv --non-interactive {{ skip_tests }} tests

about:
  home: https://pyglet.org
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE
  summary: Cross-platform windowing and multimedia library
  dev_url: https://github.com/pyglet/pyglet

extra:
  recipe-maintainers:
    - mwcraig
    - jakirkham
    - bitcraft
    - hoechenberger
